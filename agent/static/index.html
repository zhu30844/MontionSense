<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotionSense - IP Camera</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/calendar.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="logo">
                    <i class="fas fa-video"></i>
                    <span id="logoText">MotionSense</span>
                </h1>
                <div class="header-controls">
                    <button id="languageToggle" class="btn btn-secondary">
                        <i class="fas fa-globe"></i>
                        <span id="langText">简体中文</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Navigation -->
        <nav class="nav">
            <button class="nav-item active" data-view="live">
                <i class="fas fa-broadcast-tower"></i>
                <span id="navLive">实时监控</span>
            </button>
            <button class="nav-item" data-view="calendar">
                <i class="fas fa-calendar-alt"></i>
                <span id="navCalendar">历史记录</span>
            </button>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Live Stream View -->
            <div id="liveView" class="view active">
                <div class="stream-container">
                    <div class="stream-header">
                        <h2 id="streamTitle">实时视频流</h2>
                        <div class="stream-controls">
                            <button id="fullscreenBtn" class="btn btn-primary">
                                <i class="fas fa-expand"></i>
                                <span id="fullscreenText">全屏</span>
                            </button>
                        </div>
                    </div>
                    <div class="stream-wrapper">
                        <img id="streamImage" src="/api/stream" alt="Live Stream" />
                        <div class="stream-overlay">
                            <div class="stream-status">
                                <span class="status-dot"></span>
                                <span id="statusText">连接中...</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="status-card">
                    <div class="status-card-header">
                        <h3 id="statusCardTitle">设备状态</h3>
                        <span class="status-card-time" id="statusUpdated"></span>
                    </div>
                    <div class="status-grid">
                        <div class="status-item">
                            <span class="status-label" id="labelCpuTemp">温度</span>
                            <span class="status-value" id="valCpuTemp">—</span>
                        </div>
                        <div class="status-item">
                            <span class="status-label" id="labelWorkLoad">负载</span>
                            <span class="status-value" id="valWorkLoad">—</span>
                        </div>
                        <div class="status-item">
                            <span class="status-label" id="labelMemory">内存</span>
                            <span class="status-value" id="valMemory">—</span>
                        </div>
                        <div class="status-item">
                            <span class="status-label" id="labelClients">观看数</span>
                            <span class="status-value" id="valClients">—</span>
                        </div>
                        <div class="status-item">
                            <span class="status-label" id="labelSystemUptime">系统运行</span>
                            <span class="status-value" id="valSystemUptime">—</span>
                        </div>
                        <div class="status-item">
                            <span class="status-label" id="labelLastRecord">最近录像</span>
                            <span class="status-value" id="valLastRecord">—</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Calendar View -->
            <div id="calendarView" class="view">
                <div class="calendar-container">
                    <div class="calendar-header">
                        <h2 id="calendarTitle">运动检测热力图</h2>
                        <p id="calendarDesc">点击日期查看详细记录</p>
                    </div>
                    <div id="calendar"></div>
                </div>
            </div>
        </main>

        <!-- Loading Overlay -->
        <div id="loadingOverlay" class="loading-overlay">
            <div class="loading-spinner">
                <i class="fas fa-spinner fa-spin"></i>
                <span id="loadingText">加载中...</span>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/app.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/stream.js"></script>
</body>
</html>
